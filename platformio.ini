; ASURT collision avoidance: two ATmega32 boards, one PlatformIO project.
;   pio run -e sensor     ->  .pio/build/sensor/firmware.hex    (AVR 2: HC-SR04 + UART TX)
;   pio run -e actuator   ->  .pio/build/actuator/firmware.hex  (AVR 1: UART RX + LED + buzzer)
; Host unit tests (no board needed): sh test/host/run_tests.sh

; Common settings shared by both boards
[env]
platform = atmelavr
board = ATmega32
board_build.f_cpu = 16000000L
build_flags =
    -I lib/MCAL
    -I lib/HAL
    -I lib/Service
    -I src/APP
    -Wall
    -Wextra

; AVR 2: ultrasonic sensor node   ->  pio run -e sensor
[env:sensor]
build_src_filter = -<*> +<APP/sensor_main.c>
lib_deps =
    MCAL
    HAL

; AVR 1: LED + buzzer node   ->  pio run -e actuator
[env:actuator]
build_src_filter = -<*> +<APP/actuator_main.c> +<APP/COLLISION/>
lib_deps =
    MCAL
    HAL
    Service
